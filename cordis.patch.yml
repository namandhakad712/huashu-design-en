# DeepSeek Harness plugin entry: reuse DSH's bundled filesystem skill provider,
# treating the node_modules directory that contains this package as the skill root, so the SKILL.md at the package root is discovered.
- insert:
    - id: huashu-design-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: huashu-design-en
        bundledSkillDir: !!js process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('huashu-design-en/package.json')))
